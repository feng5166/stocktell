<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>网络不可用 · StockTell</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f7f7f5; color: #1a1d24; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .card { text-align: center; padding: 32px 24px; max-width: 320px; }
  h1 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
  p { font-size: 14px; line-height: 1.7; color: #6b7280; margin: 0 0 20px; }
  button { font-size: 14px; padding: 8px 24px; border: 1px solid #d1d5db; border-radius: 8px;
           background: #fff; color: #1a1d24; cursor: pointer; }
  button:active { background: #f3f4f6; }
  .brand { font-size: 12px; color: #9ca3af; margin-top: 28px; }
</style>
</head>
<body>
<div class="card">
  <h1>网络暂时不可用</h1>
  <p>StockTell 内容加载失败,可能是网络波动。请检查网络后重试;微信内可尝试右上角菜单刷新。</p>
  <button onclick="location.reload()">重新加载</button>
  <div class="brand">StockTell · 我不懂产业链,你告诉我怎么想</div>
</div>
</body>
</html>
