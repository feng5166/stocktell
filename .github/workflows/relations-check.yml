# P1-4 关系库准入门(第四批评审):关系数据/resolver 改动必须过 lint + 样本 + health,
# 防旧源漏读/跨链串档/direct 缺证据/禁词/unknown segment 回归随 push main 直接部署。
# lint + resolver-samples + health + source-leakage + compliance-block 回放 = 全 blocking。
# full / market-closed 回放依赖东财历史行情(网络),挂 replay-nightly.yml,不进 PR blocking。
# V3(四轮 review):paths 必含 chains.ts(insightCount 依赖 segments 配置)与 stocks.ts
# (eventCount 依赖美股池)——fixture 对照的每个输入源都必须能触发本门禁;push/PR 两列表保持对称。
name: relations-check

on:
  push:
    branches: [main, stocktell2.0]
    paths:
      - "src/data/chain-relations*"
      - "src/data/segment-registry.ts"
      - "src/data/insight-chains.ts"
      - "src/data/direct-evidence.ts"
      - "src/data/indirect-evidence*"
      - "src/data/chains.ts"
      - "src/data/stocks.ts"
      - "src/lib/relation*.ts"
      - "src/lib/generate.ts"
      - "src/lib/insight-pipeline/**"
      - "src/lib/content-guard.ts"
      - "src/lib/holiday-bridge.ts"
      - "scripts/relation-lint.ts"
      - "scripts/resolver-*.ts"
      - "scripts/source-leakage.ts"
      - "scripts/leakage-rules.ts"
      - "scripts/pipeline-replay.ts"
      - "fixtures/replay/**"
  pull_request:
    paths:
      - "src/data/chain-relations*"
      - "src/data/segment-registry.ts"
      - "src/data/insight-chains.ts"
      - "src/data/direct-evidence.ts"
      - "src/data/indirect-evidence*"
      - "src/data/chains.ts"
      - "src/data/stocks.ts"
      - "src/lib/relation*.ts"
      - "src/lib/generate.ts"
      - "src/lib/insight-pipeline/**"
      - "src/lib/content-guard.ts"
      - "src/lib/holiday-bridge.ts"
      - "scripts/relation-lint.ts"
      - "scripts/resolver-*.ts"
      - "scripts/source-leakage.ts"
      - "scripts/leakage-rules.ts"
      - "scripts/pipeline-replay.ts"
      - "fixtures/replay/**"

jobs:
  check-relations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # blocking:关系准入 lint + 关键样本 + health(任一非零即失败)
      - name: relation lint (blocking)
        run: npm run check:relation-lint
      - name: resolver samples (blocking)
        run: npm run check:resolver-samples
      - name: resolver health (blocking)
        run: npm run check:resolver-health
      # blocking:旧源直读(generate/admin 已切 resolver,source-leakage=0,转 blocking 关死回归口)
      - name: source leakage (blocking)
        run: npm run check:source-leakage -- --blocking
      # blocking:合规阻断回放(禁词 fixture 走真实 generateDailyInsight 全链路)。零网络/零 DB/秒级:
      # llm=off 摘 LLM/博查 key + INSIGHT_SKIP_URL_VERIFY 免 HEAD 探测;无 POSTGRES_PRISMA_URL 则 DB 层为 null。
      - name: pipeline replay · compliance-block (blocking)
        run: npx tsx scripts/pipeline-replay.ts --date=2026-07-02 --mode=compliance-block --llm=off
      # blocking:节后首日观察(2.1-C Case F)。同样零网络零 DB(buildHolidayBridge 纯函数+fixture 素材):
      # 断言口径不伪装/不硬造/guard 纵深/宁缺勿造。
      - name: pipeline replay · holiday-bridge (blocking)
        run: npx tsx scripts/pipeline-replay.ts --date=2026-07-06 --mode=holiday-bridge --llm=off
      # blocking:full / market-closed 本地 fixture 回放(2.2-A 行情落档后升格,负责人拍板)。
      # 行情来自 fixtures/replay/ 快照(零网络,不受东财/Yahoo 波动影响),并与录制时的
      # expected snapshot 稳定子集对照——管线结论漂移在 PR 里显式红出。实抓路径留在 nightly 作外部源健康检查。
      - name: pipeline replay · full via fixture (blocking)
        run: npx tsx scripts/pipeline-replay.ts --date=2026-07-02 --mode=full --llm=off --fixture
      - name: pipeline replay · market-closed via fixture (blocking)
        run: npx tsx scripts/pipeline-replay.ts --date=2026-07-06 --mode=market-closed --llm=off --fixture
